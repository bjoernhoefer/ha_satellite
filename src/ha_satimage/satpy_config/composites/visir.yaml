# Custom cross-sensor composites (SEVIRI, FCI), extending Satpy's
# built-in definitions (loading: see satpy_render.py).
sensor_name: visir

composites:
  # Natural color by day, IR clouds by night - without the background maps
  # that Satpy's "*_with_night_ir" would download at runtime. For FCI
  # ~1 km by day; default for mtg_fci.
  natural_color_with_night_cloudtop:
    compositor: !!python/name:satpy.composites.fill.DayNightCompositor
    standard_name: natural_color_with_night_ir
    lim_low: 80
    lim_high: 90
    prerequisites:
      - natural_color
      - cloudtop
