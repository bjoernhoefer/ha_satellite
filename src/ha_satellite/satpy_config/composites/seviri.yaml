# Custom SEVIRI composites, extending Satpy's built-in definitions
# (loaded via satpy.config "config_path", see satpy_render.py).
sensor_name: visir/seviri

composites:
  # Natural color (IR_016/VIS008/VIS006, ~3 km) sharpened with the HRV
  # channel (~1 km), hue is preserved (see sources/hrv_composite.py).
  # Can only be computed after resampling (different grids).
  natural_color_hrv:
    compositor: !!python/name:ha_satellite.sources.hrv_composite.HrvLuminanceSharpenedRGB
    prerequisites:
      - name: IR_016
        modifiers: [sunz_corrected]
      - name: VIS008
        modifiers: [sunz_corrected]
      - name: VIS006
        modifiers: [sunz_corrected]
    optional_prerequisites:
      - name: HRV
        modifiers: [sunz_corrected]
    standard_name: natural_color

  # Like natural_color_raw_with_night_ir, but HRV-sharpened during the day.
  natural_color_hrv_with_night_ir:
    compositor: !!python/name:satpy.composites.fill.DayNightCompositor
    standard_name: natural_color_with_night_ir
    lim_low: 80
    lim_high: 90
    prerequisites:
      - natural_color_hrv
      - cloudtop
