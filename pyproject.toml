[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha_satellite"
version = "0.1.0"
description = "Satellitenbilder von EUMETSAT als Kamera-Entitäten für Home Assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "apscheduler>=3.10",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pillow>=10.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "numpy>=1.26",
    # Phase 2: EUMETSAT-Download + Satpy-Rendering. Im Docker-Image kommen
    # diese Pakete vorgebaut aus conda-forge (siehe docker/Dockerfile).
    "eumdac>=3.0",
    "satpy>=0.60",
    "pyresample>=1.34",
    "pyproj>=3.6",
    "dask[array]>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# Browser-Klicktests der Web-UI; zusätzlich `playwright install chromium`.
ui = [
    "pytest-playwright>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ha_satellite = ["templates/*.html", "satpy_config/composites/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ui: Browser-Klicktests der Web-UI (benötigen das Extra [ui] und Chromium)",
]
