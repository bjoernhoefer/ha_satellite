services:
  ha_satellite:
    image: ghcr.io/bjoernhoefer/ha_satellite:${HA_SATELLITE_TAG:-latest}
    container_name: ha_satellite
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${HA_SATELLITE_PORT:-6060}:6060"
    volumes:
      # Configuration (config.yaml), logs, cache and (by default) the frames.
      # Lives on the host, so it survives image updates and container
      # re-creation. Back it up by copying this directory.
      - ${HOST_DATA_DIR:-./data}:/data
      # Additional host disks (e.g. /mnt/data). The frame storage location
      # is chosen in the web UI ("Storage & history") - only paths below
      # mounted volumes are persistent. Use "/mnt:/mnt:rslave" if disks are
      # mounted after the container starts.
      - /mnt:/mnt
    environment:
      # UID/GID used for writing - must match the owner of the data
      # directories on the host (see `id` on the host).
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Optional: overrides the credentials stored via the UI.
      - EUMETSAT_CONSUMER_KEY=${EUMETSAT_CONSUMER_KEY:-}
      - EUMETSAT_CONSUMER_SECRET=${EUMETSAT_CONSUMER_SECRET:-}
    labels:
      # Opt in to automatic updates by the watchtower service below.
      - com.centurylinklabs.watchtower.enable=true
    # Healthcheck is defined in the image (docker/Dockerfile).
    # Conservative limits so rendering does not starve other services on
    # small hosts such as a Raspberry Pi.
    mem_limit: ${HA_SATELLITE_MEM_LIMIT:-768m}
    cpus: ${HA_SATELLITE_CPUS:-1.5}

  # Automatically pulls a newly published image and restarts ha_satellite.
  # Only containers labelled com.centurylinklabs.watchtower.enable=true are
  # touched. Remove this service if you prefer manual updates.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: ha_satellite_watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-3600}
      - TZ=${TZ:-UTC}
