services:
  ha_satellite:
    image: ghcr.io/bjoernhoefer/ha_satellite:latest
    container_name: ha_satellite
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "6060:6060"
    volumes:
      # Konfiguration, Logs und (standardmäßig) die Bilder.
      - ./data:/data
      # Weitere Datenträger des Hosts (z. B. /mnt/data, /mnt/data2). Der
      # Speicherort der Bilder wird in der Web-UI gewählt ("Speicherort &
      # Historie") - nur Pfade unterhalb eingehängter Volumes sind dauerhaft.
      # Sollen erst nach dem Containerstart eingehängte Datenträger sichtbar
      # werden, stattdessen "/mnt:/mnt:rslave" verwenden.
      - /mnt:/mnt
    environment:
      # UID/GID, mit der der Dienst schreibt - muss zum Besitzer des
      # Bilderverzeichnisses auf dem Host passen (siehe `id` auf dem Host).
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Optional: überschreibt die in der UI gespeicherten Zugangsdaten.
      - EUMETSAT_CONSUMER_KEY=${EUMETSAT_CONSUMER_KEY:-}
      - EUMETSAT_CONSUMER_SECRET=${EUMETSAT_CONSUMER_SECRET:-}
    # Healthcheck ist im Image definiert (docker/Dockerfile).
    # Der Pi 5 teilt sich die Ressourcen mit dem grafana-Container -
    # konservatives Limit, damit Rendering nicht Grafana ausbremst.
    # `mem_limit`/`cpus` wirken auch im normalen (Nicht-Swarm-)
    # `docker compose up`; der `deploy.resources.limits`-Block ist
    # zusätzlich für den Fall eines Swarm-Deployments dokumentiert.
    mem_limit: 768m
    cpus: 1.5
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.5"
